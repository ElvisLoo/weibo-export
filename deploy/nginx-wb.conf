# Nginx 反向代理配置：wb.jikegang.com → FastAPI(127.0.0.1:8765)
#
# 关键点：
# 1. 适配腾讯云 EdgeOne（EO）回源 —— EO 会带 X-Forwarded-For / X-Real-IP 等头
# 2. **禁用代理缓冲**，否则 /api/job 进度轮询会被 Nginx 攒批导致前端卡顿
# 3. 超时对齐 uvicorn（keep-alive 75s）
# 4. 上传大 Cookie 时提高 client_body_buffer_size

upstream weibo_export_backend {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name wb.jikegang.com;

    # 访问日志（不记录 Cookie/请求体，避免敏感信息落盘）
    access_log /var/log/nginx/wb.jikegang.com.access.log;
    error_log  /var/log/nginx/wb.jikegang.com.error.log;

    # 客户端请求体上限（Cookie 通常 <10KB，留余量）
    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # 通用代理头
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 透传 EO 的真实 IP（若存在）
    proxy_set_header X-EO-Real-IP      $http_x_real_ip;

    # ------------------------------------------------------------
    # /api/* —— 动态接口，**绝不缓冲**
    # EO 侧也必须配「不缓存」规则，否则进度轮询会拿到旧数据
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://weibo_export_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 关键：关闭缓冲，让进度实时透传到 EO 再到浏览器
        proxy_buffering off;
        proxy_cache off;

        # 超时对齐 uvicorn
        proxy_connect_timeout 5s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;

        # 防止 EO 二次缓存（发 Cache-Control: no-store）
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ------------------------------------------------------------
    # /files/* —— 导出文件下载，允许 EO 缓存（文件名带时间戳，幂等）
    # 但**源站侧不缓冲**，避免大文件占用 Nginx 内存
    # ------------------------------------------------------------
    location /files/ {
        proxy_pass http://weibo_export_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;  # 流式转发，节省 Nginx 内存

        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 文件下载：告诉 EO 可缓存 1 小时
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ------------------------------------------------------------
    # /static/* —— 前端静态资源（图标等），可被 EO 缓存
    # ------------------------------------------------------------
    location /static/ {
        proxy_pass http://weibo_export_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering on;
        proxy_cache_valid 200 1h;

        add_header Cache-Control "public, max-age=3600" always;
    }

    # ------------------------------------------------------------
    # / —— 前端 HTML 主页（每次访问应该拿到最新版，故 no-cache）
    # ------------------------------------------------------------
    location / {
        proxy_pass http://weibo_export_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering on;
        proxy_cache off;

        proxy_connect_timeout 5s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;

        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 健康检查端点（EO 探活用）
    location = /healthz {
        proxy_pass http://weibo_export_backend/api/status;
        access_log off;
    }

    # 屏蔽常见扫描路径（EO 会挡一部分，这里二次兜底）
    location ~* /\.(git|env|htaccess) {
        return 404;
    }
    location ~* \.(php|asp|aspx|jsp)$ {
        return 404;
    }
}

